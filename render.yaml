services:
  # Backend Web Service
  - type: web
    name: deeptrace-security-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx knex migrate:latest && npx knex seed:run
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: deeptrace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

  # Frontend Static Site
  - type: web
    name: deeptrace-security-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://deeptrace-security-backend.onrender.com/api

databases:
  - name: deeptrace-db
    plan: free
    databaseName: deeptrace
    user: postgres
