name: DeepTrace Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: deeptrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Database Migrations & Seeds
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/deeptrace_test
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_characters_long
        run: |
          cd backend
          npm run migrate:latest
          npm run seed:run

      - name: Run Backend Test Suite (15/15 Integration & Security Tests)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/deeptrace_test
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_characters_long
        run: |
          cd backend
          npm test

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build
